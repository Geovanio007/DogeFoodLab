<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/dogefood-logo.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/dogefood-logo.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2937" />
    <!-- Cache Control -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- Mobile Web App Optimizations -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DogeFood Lab" />
    <!-- Google Fonts — loaded non-render-blocking so a slow/failed font CDN
         never blocks the page in restrictive webviews. Falls back gracefully
         to system-ui via font-family stacks if Bowlby/Fredoka aren't ready. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&family=Bowlby+One&family=Luckiest+Guy&display=swap"
      media="print"
      onload="this.media='all'; this.onload=null;"
    />
    <meta
      name="description"
      content="DogeFood Lab - Mix, Test & Upgrade Your Way to the Top!"
    />
    <title>DogeFood Lab</title>
    <!-- Telegram WebApp Script — loaded async + with error handler so a network
         failure (e.g. inside MyDoge wallet webview where telegram.org may be
         blocked or unreachable) never blocks the page from rendering. -->
    <script>
      (function () {
        try {
          var s = document.createElement('script');
          s.src = 'https://telegram.org/js/telegram-web-app.js';
          s.async = true;
          s.defer = true;
          s.onerror = function () { /* swallow — Telegram features simply won't be available */ };
          (document.head || document.documentElement).appendChild(s);
        } catch (e) { /* no-op */ }
      })();
    </script>
    <!-- Stubs for optional wallet adapters pulled in transitively by DogeOS SDK.
         These globals are normally provided by host pages that ship the
         respective wallet bundles. We stub them out so the SDK's adapter
         registration code doesn't crash at module evaluation time. -->
    <script>
      (function () {
        try {
          var g = (typeof globalThis !== 'undefined') ? globalThis : window;
          if (!g.TronWebProto) {
            g.TronWebProto = {
              Transaction: function () {},
              transaction: { Transaction: function () {} },
              Raw: function () {},
              Contract: function () {},
            };
          }
        } catch (e) { /* no-op */ }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
